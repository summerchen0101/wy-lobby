kind: pipeline
type: docker
name: web-spa

trigger:
  event:
    - push
    - tag
    - pull_request

steps:
  # ────────────────────────────────────────────────
  # 共用：安裝依賴
  # ────────────────────────────────────────────────
  - name: install
    image: node:20-alpine
    commands:
      - node --version
      - npm ci --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

  # ────────────────────────────────────────────────
  # 共用：Lint（PR / push / tag 都跑）
  # ────────────────────────────────────────────────
  - name: lint
    image: node:20-alpine
    depends_on: [install]
    commands:
      - npm run lint

  # ════════════════════════════════════════════════
  # Alpha：push to branch dev 觸發 → 部署到內網 NAS
  # ════════════════════════════════════════════════
  - name: build-alpha
    image: node:20-alpine
    depends_on: [lint]
    environment:
      VITE_API_BASE: https://apis-us-alpha.ffglobaltech.com
      VITE_WS_URL: wss://app-us-alpha.ffglobaltech.com/ws
      VITE_USE_SLOT_WEBENTRY: "true"
      # VITE_UNITY_WEBENTRY_URL: https://unityweb-alpha.ffglobaltech.com/0000/WebGL_Build_Alpha/index.html
      VITE_UNITY_WEBENTRY_URL: https://unityweb-alpha.ffglobaltech.com/0001/WebGL_Build_Alpha/index.html
      VITE_USE_WS_LOBBY_GAMES: "true"
      VITE_OPEN_GAMES_IN_NEW_WINDOW: "false"
      VITE_PAYMENT_FEATURES_ENABLED: "true"
      VITE_THIRD_PARTY_GAMES_ENABLED: "true"
      VITE_THIRD_PARTY_GAME_THUMB_BASE: https://nas01.ffglobaltech.com
      VITE_CLIENT_VER: "web-alpha-${DRONE_COMMIT_SHA:0:8}"
      VITE_ZENDESK_KEY: "9720e0de-05e6-449b-be95-f5b42d5e7df4"
      VITE_GTM_ID: "GTM-T6R6RQ79"
      VITE_PUBLIC_IMAGE_CDN_BASE: "https://nas01.ffglobaltech.com/us-game-lobby"
      VITE_DEV_CONSOLE: "true"
      VITE_GATEWAY_WS_TRACE: "true"
      #VITE_RADAR_PUBLISHABLE_KEY: "prj_test_pk_a72f521bb1405c552a704ad4d925509c08acb511"
      # VITE_SOCURE_SDK_KEY:
      #   from_secret: vite_socure_sdk_key
    commands:
      - npm run build
      - ls -lah dist/
    when:
      event: [push]
      branch: [dev]

  - name: deploy-nas-alpha
    image: alpine:3
    depends_on: [build-alpha]
    environment:
      NAS_SSH_KEY:
        from_secret: nas_ssh_key
      NAS_HOST:
        from_secret: nas_host
      NAS_USER:
        from_secret: nas_user
      NAS_PATH:
        from_secret: nas_path_alpha
    commands:
      - apk add --no-cache openssh-client rsync
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$NAS_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - >
        rsync -rltv --delete --checksum
        --exclude='@eaDir' --exclude='#recycle' --exclude='@tmp'
        -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
        dist/ "$NAS_USER@$NAS_HOST:$NAS_PATH/"
    when:
      event: [push]
      branch: [dev]

  # ════════════════════════════════════════════════
  # Alpha：tag to branch dev 觸發 → 部署到內網 NAS
  # ════════════════════════════════════════════════
  - name: build-alpha-tag
    image: node:20-alpine
    depends_on: [lint]
    environment:
      VITE_API_BASE: https://apis-us-alpha.ffglobaltech.com
      VITE_WS_URL: wss://app-us-alpha.ffglobaltech.com/ws
      VITE_USE_SLOT_WEBENTRY: "true"
      VITE_UNITY_WEBENTRY_URL: https://unityweb-alpha.ffglobaltech.com/0001/WebGL_Build_Alpha/index.html
      VITE_USE_WS_LOBBY_GAMES: "true"
      VITE_OPEN_GAMES_IN_NEW_WINDOW: "false"
      VITE_PAYMENT_FEATURES_ENABLED: "true"
      VITE_THIRD_PARTY_GAMES_ENABLED: "true"
      VITE_THIRD_PARTY_GAME_THUMB_BASE: https://nas01.ffglobaltech.com
      VITE_CLIENT_VER: "web-alpha-${DRONE_COMMIT_SHA:0:8}"
      VITE_ZENDESK_KEY: "9720e0de-05e6-449b-be95-f5b42d5e7df4"
      VITE_GTM_ID: "GTM-T6R6RQ79"
      VITE_PUBLIC_IMAGE_CDN_BASE: "https://nas01.ffglobaltech.com/us-game-lobby"
      VITE_DEV_CONSOLE: "true"
      VITE_GATEWAY_WS_TRACE: "true"
      #VITE_RADAR_PUBLISHABLE_KEY: "prj_test_pk_a72f521bb1405c552a704ad4d925509c08acb511"
      VITE_SOCURE_SDK_KEY: "32c3e4c7-bbd2-43dd-8282-472ed9f4abcc"
    commands:
      - npm run build
      - ls -lah dist/
    when:
      event: [tag]
      ref:
        - refs/tags/dev-v*

  - name: deploy-nas-alpha-tag
    image: alpine:3
    depends_on: [build-alpha-tag]
    environment:
      NAS_SSH_KEY:
        from_secret: nas_ssh_key
      NAS_HOST:
        from_secret: nas_host
      NAS_USER:
        from_secret: nas_user
      NAS_PATH:
        from_secret: nas_path_alpha
    commands:
      - apk add --no-cache openssh-client rsync
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - printf '%s\n' "$NAS_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H "$NAS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - >
        rsync -rltv --delete --checksum
        --exclude='@eaDir' --exclude='#recycle' --exclude='@tmp'
        -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
        dist/ "$NAS_USER@$NAS_HOST:$NAS_PATH/"
    when:
      event: [tag]
      ref:
        - refs/tags/dev-v*

  # ════════════════════════════════════════════════
  # US：tag us-v* 觸發
  # ════════════════════════════════════════════════
  - name: build-us
    image: node:20-alpine
    depends_on: [lint]
    environment:
      VITE_API_BASE:
        from_secret: vite_api_base_us
      VITE_WS_URL:
        from_secret: vite_ws_url_us
      VITE_USE_SLOT_WEBENTRY: "true"
      # VITE_UNITY_WEBENTRY_URL: "https://luklokcasino.com/games"
      VITE_UNITY_WEBENTRY_URL:
        from_secret: vite_unity_webentry_us
      VITE_OPEN_GAMES_IN_NEW_WINDOW: "false"
      VITE_USE_WS_LOBBY_GAMES: "true"
      # Shop 第三方金流結帳頁；串接新金流商後改為 "true"
      VITE_PAYMENT_FEATURES_ENABLED: "true"
      VITE_THIRD_PARTY_GAMES_ENABLED: "true"
      VITE_CLIENT_VER: "web-us-${DRONE_TAG}"
      VITE_ZENDESK_KEY: "9720e0de-05e6-449b-be95-f5b42d5e7df4"
      VITE_GTM_ID: "GTM-T6R6RQ79"
      VITE_PUBLIC_IMAGE_CDN_BASE: "https://unityweb-cdn.luklokcasino.com/us-game-lobby"
      VITE_DEV_CONSOLE: "false"
      VITE_RADAR_PUBLISHABLE_KEY: "prj_live_pk_e6c2c0e370ace2db49c21d2fc81572acaafc61fa"
      # VITE_SOCURE_SDK_KEY:
      #   from_secret: vite_socure_sdk_key
    commands:
      - npm run build
      - ls -lah dist/
    when:
      event: [tag]
      ref:
        - refs/tags/us-v*

  - name: deploy-us
    image: google/cloud-sdk:alpine
    depends_on: [build-us]
    environment:
      GOOGLE_CREDENTIALS:
        from_secret: gcp_sa_us
      BUCKET:
        from_secret: gcs_bucket_us
      CF_API_TOKEN:
        from_secret: cf_api_token_us
      CF_ZONE_ID:
        from_secret: cf_zone_id_us
      SITE_URL:
        from_secret: site_url_us
      REGION: us
    commands:
      - apk add --no-cache jq
      - echo "$GOOGLE_CREDENTIALS" > /tmp/sa.json
      - gcloud auth activate-service-account --key-file=/tmp/sa.json
      - gcloud config set project "$(jq -r .project_id /tmp/sa.json)"
      - sh ./scripts/drone-deploy.sh
    when:
      event: [tag]
      ref:
        - refs/tags/us-v*

  # ════════════════════════════════════════════════
  # TW：tag tw-v* 觸發
  # ════════════════════════════════════════════════
  - name: build-tw
    image: node:20-alpine
    depends_on: [lint]
    environment:
      VITE_API_BASE: https://app-apis.wncocasino.com
      # VITE_API_BASE:
      #   from_secret: vite_api_base_tw
      VITE_WS_URL: wss://app-prod.wncocasino.com/ws
      # VITE_WS_URL:
      #   from_secret: vite_ws_url_tw
      VITE_USE_SLOT_WEBENTRY: "true"
      VITE_UNITY_WEBENTRY_URL:
        from_secret: vite_unity_webentry_tw
      VITE_OPEN_GAMES_IN_NEW_WINDOW: "false"
      VITE_USE_WS_LOBBY_GAMES: "true"
      # Shop 第三方金流結帳頁；串接新金流商後改為 "true"
      VITE_PAYMENT_FEATURES_ENABLED: "true"
      VITE_THIRD_PARTY_GAMES_ENABLED: "true"
      VITE_CLIENT_VER: "web-tw-${DRONE_TAG}"
      VITE_ZENDESK_KEY: "9720e0de-05e6-449b-be95-f5b42d5e7df4"
      VITE_GTM_ID: "GTM-T6R6RQ79"
      VITE_PUBLIC_IMAGE_CDN_BASE: "https://unityweb-cdn.boss-fun.com/us-game-lobby"
      VITE_DEV_CONSOLE: "true"
      VITE_GATEWAY_WS_TRACE: "true"
      #VITE_RADAR_PUBLISHABLE_KEY: "prj_test_pk_a72f521bb1405c552a704ad4d925509c08acb511"
      # VITE_SOCURE_SDK_KEY:
      #   from_secret: vite_socure_sdk_key
    commands:
      - npm run build
      - ls -lah dist/
    when:
      event: [tag]
      ref:
        - refs/tags/tw-v*

  - name: deploy-tw
    image: google/cloud-sdk:alpine
    depends_on: [build-tw]
    environment:
      GOOGLE_CREDENTIALS:
        from_secret: gcp_sa_tw
      BUCKET:
        from_secret: gcs_bucket_tw
      CF_API_TOKEN:
        from_secret: cf_api_token_tw
      CF_ZONE_ID:
        from_secret: cf_zone_id_tw
      SITE_URL:
        from_secret: site_url_tw
      REGION: tw
    commands:
      - apk add --no-cache jq
      - echo "$GOOGLE_CREDENTIALS" > /tmp/sa.json
      - gcloud auth activate-service-account --key-file=/tmp/sa.json
      - gcloud config set project "$(jq -r .project_id /tmp/sa.json)"
      - sh ./scripts/drone-deploy.sh
    when:
      event: [tag]
      ref:
        - refs/tags/tw-v*
