# Netlify Base directory = web（此檔與 repo 根 netlify.toml 擇一；根檔含 base = "web"）
[build]
  command = "npm run build"
  publish = "dist"

# React Router（BrowserRouter）：子路徑與重新整理導到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
